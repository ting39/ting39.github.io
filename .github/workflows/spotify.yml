name: Update Spotify top 5

on:
  schedule:
    - cron: "0 0 * * 1"   # Mondays 00:00 UTC = 08:00 Taiwan
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: spotify
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch top tracks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 tools/update_spotify.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- spotify.json && git ls-files --error-unmatch spotify.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spotify.json
          git commit -m "Update Spotify top 5"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN may not trigger a Pages rebuild, so request one.
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
