<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · ting39</title>
  <meta name="description" content="This page drifted off into space.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07070d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- absolute paths: GitHub Pages serves this file at whatever URL was missing -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/blog.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 110px 16px 40px; }
    .lost-inner { max-width: 560px; display: grid; gap: 18px; justify-items: center; }
    .big {
      font-size: clamp(6rem, 28vw, 11rem); font-weight: 700; line-height: .9; letter-spacing: -.05em;
      background: linear-gradient(120deg, var(--a1), var(--a2), var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: drift 6s ease-in-out infinite;
    }
    @keyframes drift { 50% { transform: translateY(-10px) rotate(-2deg); } }
    .shell {
      width: 100%; text-align: left; font: .9rem/1.6 "JetBrains Mono", monospace; padding: 14px 18px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--border); overflow-wrap: anywhere;
    }
    .shell .ps { color: var(--a2); }
    .shell .err { color: #ff6b81; }
    :root[data-theme="light"] .shell .err { color: #d42a4f; }
    .shell .dim { color: var(--muted); }
    .shell a { color: var(--a2); text-decoration: underline; text-underline-offset: 3px; }
    .lost .hero-actions { margin-top: 4px; }
    .lost h1 { font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.25; text-wrap: balance; }
  </style>
</head>
<body class="blog-page">
  <canvas id="sky" aria-hidden="true"></canvas>
  <header class="nav">
    <a class="logo" href="/">ting39<span class="blink">_</span></a>
    <nav aria-label="Site">
      <a href="/#about">about</a>
      <a href="/#projects">projects</a>
      <a href="/blog/">blog</a>
      <a href="/#contact">contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark theme">◐</button>
  </header>

  <main class="lost" id="content">
    <div class="lost-inner">
      <p class="big" aria-hidden="true">404</p>
      <h1>This page drifted off into space.</h1>
      <div class="shell" aria-live="polite">
        <div><span class="ps">guest@ting39:~$</span> cd <span id="path">/somewhere</span></div>
        <div class="err">cd: no such file or directory</div>
        <div class="dim" id="suggest"></div>
      </div>
      <div class="hero-actions">
        <a class="btn primary" href="/">Take me home</a>
        <a class="btn ghost" href="/#projects">See projects</a>
        <a class="btn ghost" href="/blog/">Read the blog</a>
      </div>
    </div>
  </main>

  <footer>
    <p class="mono">built from scratch · hosted on GitHub Pages · © <span id="footYear">2026</span> ting39 <button class="term-btn" type="button" data-terminal aria-label="Open terminal" title="terminal (press `)">&gt;_</button></p>
  </footer>

  <script>
    (() => {
      const path = decodeURIComponent(location.pathname);
      document.getElementById("path").textContent = path;
      // suggest the closest real page for typos like /2o48 or /gatewrite
      const pages = { "/": "the homepage", "/blog/": "the blog", "/2048/": "2048: Stellar", "/gatewright/": "Gatewright", "/eighth-segment/": "Eighth Segment", "/tinygpt/": "Little Poet" };
      const lev = (a, b) => {
        const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 1; j <= b.length; j++) d[0][j] = j;
        for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        return d[a.length][b.length];
      };
      const first = "/" + (path.toLowerCase().split("/").filter(Boolean)[0] || "") + "/";
      const [best, dist] = Object.keys(pages).filter((p) => p !== "/").map((p) => [p, lev(first, p)]).sort((a, b) => a[1] - b[1])[0];
      const out = document.getElementById("suggest");
      if (dist <= 3) {
        out.append("did you mean ");
        const a = Object.assign(document.createElement("a"), { href: best, textContent: best });
        out.append(a, ` (${pages[best]})?`);
      } else out.textContent = "try one of the links below, or press ` for a terminal.";
    })();
  </script>
  <script src="/projects.js"></script>
  <script src="/assets/blog.js" defer></script>
</body>
</html>
